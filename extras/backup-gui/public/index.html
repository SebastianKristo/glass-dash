<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hytte Backup</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231c1c20'/><text x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' fill='%23ecc56a' font-family='sans-serif'>↻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ok:oklch(0.78 0.15 150);--warn:oklch(0.82 0.14 75);--run:oklch(0.78 0.12 245);--fail:oklch(0.7 0.17 25);--acc:#ecc56a}
*{box-sizing:border-box}
body{margin:0;background:#0f0f11;color:#ececee;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#ecc56a;text-decoration:none}a:hover{color:#f5d68c}
input,select,button{font-family:inherit}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.lbl{font:500 10.5px "Geist Mono",monospace;letter-spacing:.08em}
.root{display:grid;grid-template-columns:clamp(196px,18vw,232px) minmax(0,1fr);min-height:100vh;background:#0f0f11}
aside{border-right:1px solid #222227;padding:22px 14px;display:flex;flex-direction:column;gap:28px;background:#0c0c0e;position:sticky;top:0;height:100vh}
.logo{width:34px;height:34px;border-radius:9px;background:#1c1c20;border:1px solid #2a2a30;display:grid;place-items:center;color:#ecc56a;font-size:18px;font-weight:700;flex:none}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:8px;border:0;cursor:pointer;text-align:left;font-size:13.5px;font-weight:500;background:transparent;color:#9a9aa2;width:100%}
.nav:hover{background:#1a1a1e;color:#ececee}.nav.on{background:#1c1c20;color:#ececee}
.nav .d{width:6px;height:6px;border-radius:2px;background:#3a3a42}.nav.on .d{background:#ecc56a}
.nav .c{font:500 11px "Geist Mono",monospace;color:#6b6b74}
main{padding:28px clamp(20px,3vw,40px) 60px;display:flex;flex-direction:column;gap:28px;max-width:1360px;width:100%;min-width:0}
.bp{padding:10px 18px;border-radius:9px;border:0;background:#ecc56a;color:#1a1608;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}.bp:hover{background:#f3d27f}
.bs{padding:10px 16px;border-radius:9px;border:1px solid #2c2c32;background:#17171a;color:#ececee;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}.bs:hover{background:#1f1f23}
.br{padding:6px 11px;border-radius:7px;border:1px solid #2c2c32;background:transparent;color:#d4d4d8;font-size:12.5px;cursor:pointer;white-space:nowrap}.br:hover{background:#222227}
.br.mut{color:#8b8b93;padding:6px 10px}.br.mut:hover{color:#ececee}
button:disabled{opacity:.5;cursor:default}
.card{border:1px solid #23232a;border-radius:12px;background:#151518}
.ph{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #222227;gap:12px;flex-wrap:wrap}
.ph b{font-size:15px;font-weight:600}.ph small{font-size:12.5px;color:#7d7d86}
.th{display:grid;padding:10px 20px;font:500 10.5px "Geist Mono",monospace;letter-spacing:.08em;color:#5d5d66;border-bottom:1px solid #1f1f24}
.tr{display:grid;align-items:center;padding:14px 20px;border-bottom:1px solid #1d1d22;font-size:13.5px}.tr:hover{background:#18181c}.tr:last-child{border-bottom:0}
.gj{grid-template-columns:minmax(220px,2.2fr) 1.1fr 1.1fr .8fr .7fr 1fr 150px}
.gv{grid-template-columns:minmax(260px,2.4fr) 1fr 1.2fr .8fr 130px}
.gh{grid-template-columns:1.2fr 1.4fr .8fr .8fr .9fr minmax(160px,1.6fr)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500}
.pill i,.sdot{width:6px;height:6px;border-radius:50%;display:inline-block}
.stat{padding:20px;display:flex;flex-direction:column;gap:10px}.stat .v{font-size:28px;font-weight:600;letter-spacing:-.02em}.stat .s{font-size:12.5px;color:#8b8b93}
.inp{padding:10px 12px;border-radius:8px;border:1px solid #2c2c32;background:#0f0f11;color:#ececee;font:400 13px "Geist Mono",monospace;outline:none;width:100%}.inp:focus{border-color:#ecc56a}
.fl{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:#8b8b93}
.tg{width:40px;height:23px;border-radius:12px;border:0;padding:2px;cursor:pointer;display:flex;background:#34343b;flex:none}.tg.on{background:#ecc56a;justify-content:flex-end}.tg span{width:19px;height:19px;border-radius:50%;background:#fff}
.seg{display:flex;gap:4px;padding:4px;background:#0f0f11;border:1px solid #26262b;border-radius:9px}.seg button{flex:1;padding:8px;border-radius:6px;border:0;background:transparent;color:#8b8b93;font-size:13px;font-weight:500;cursor:pointer}.seg button.on{background:#26262c;color:#ececee}
.ov{position:fixed;inset:0;background:rgba(5,5,7,.72);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:20px;overflow:auto}
.dlg{width:560px;max-width:100%;background:#151518;border:1px solid #2a2a30;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.dh{padding:20px 24px;border-bottom:1px solid #222227;display:flex;justify-content:space-between;align-items:center}.dh b{font-size:17px;font-weight:600}.dh small{font-size:12.5px;color:#7d7d86}
.db{padding:22px 24px;display:flex;flex-direction:column;gap:20px;max-height:64vh;overflow:auto}
.df{padding:16px 24px;border-top:1px solid #222227;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#121215}
.x{border:0;background:none;color:#7d7d86;font-size:20px;cursor:pointer}
.share{padding:10px 12px;border-radius:8px;border:1px solid #2a2a30;background:#111113;color:#ececee;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font:400 12.5px "Geist Mono",monospace;min-width:0}
.share.on{border-color:#ecc56a;background:#1f1c12}.share>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.share .open{color:#6b6b74;padding:0 2px 0 8px;font-size:15px;line-height:1}.share .open:hover{color:#ecc56a}
.crumb{display:flex;gap:2px;flex-wrap:wrap;font:400 12px "Geist Mono",monospace;color:#6b6b74;align-items:center}.crumb a{color:#9a9aa2;cursor:pointer;padding:2px 4px;border-radius:4px}.crumb a:hover{background:#1f1f24;color:#ececee}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;border:1px solid #2c2c32;font:400 12px "Geist Mono",monospace;color:#d4d4d8;background:#111113}.chip button{border:0;background:none;color:#6b6b74;cursor:pointer;padding:0}
.chip.add{border-style:dashed;color:#7d7d86;cursor:pointer}.chip.add:hover{color:#ecc56a;border-color:#ecc56a}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:#1c1c20;border:1px solid #2c2c32;padding:10px 16px;border-radius:10px;font-size:13px;transition:.25s;z-index:60}.toast.on{transform:translate(-50%,0)}
pre.log{margin:0;background:#0f0f11;border:1px solid #23232a;border-radius:9px;padding:12px;max-height:340px;overflow:auto;white-space:pre-wrap;font:400 11.5px/1.5 "Geist Mono",monospace;color:#b4b4bb}
.key{background:#0f0f11;border:1px solid #2c2c32;border-radius:8px;padding:10px 12px;font:400 11.5px/1.5 "Geist Mono",monospace;color:#9a9aa2;word-break:break-all}
@media(max-width:760px){.root{grid-template-columns:1fr}aside{position:static;height:auto;gap:16px}aside .cbox{display:none}.empty{grid-template-columns:1fr!important;padding:28px!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ovl"></div>
<div class="toast" id="toast"></div>
<script>
const C=['oklch(0.82 0.13 85)','oklch(0.78 0.12 245)','oklch(0.78 0.12 160)','oklch(0.76 0.12 320)','oklch(0.78 0.12 30)','oklch(0.78 0.12 200)'];
const OKL={ok:'0.78 0.15 150',warn:'0.82 0.14 75',run:'0.78 0.12 245',fail:'0.7 0.17 25'};
const col=(k,a)=>OKL[k]?`oklch(${OKL[k]}${a!=null?' / '+a:''})`:a!=null?`rgba(139,139,147,${a})`:'#8b8b93';
const ST={ok:{l:'OK',k:'ok'},warn:{l:'Advarsel',k:'warn'},running:{l:'Kjører',k:'run'},fail:{l:'Feilet',k:'fail'},queued:{l:'I kø',k:'run'},new:{l:'Ny',k:'none'}};
const VIEWS={overview:['Oversikt','/'],versions:['Versjoner','/versjoner'],history:['Historikk','/historikk'],settings:['Innstillinger','/innstillinger']};
const DAYS=['søn','man','tir','ons','tor','fre','lør'],MON=['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
const $=s=>document.querySelector(s),app=$('#app'),ovl=$('#ovl');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq=s=>esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800)};
async function api(u,o={}){const r=await fetch(u,{method:o.method||(o.body?'POST':'GET'),headers:{'Content-Type':'application/json'},body:o.body&&JSON.stringify(o.body)});const j=await r.json().catch(()=>({}));
 if(r.status===401&&u!=='/api/login'){showLogin(false);throw new Error('auth')}if(!r.ok)throw new Error(j.error||r.statusText);return j}
const p2=n=>String(n).padStart(2,'0');
const hm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())};
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const when=t=>{if(!t)return'Aldri';const d=new Date(t),n=Date.now();if(n-t<90e3)return'Akkurat nå';if(sameDay(t,n))return'I dag '+hm(t);if(sameDay(t,n-864e5))return'I går '+hm(t);
 if(n-t<6*864e5)return cap(DAYS[d.getDay()])+' '+hm(t);return d.getDate()+'. '+MON[d.getMonth()]+' '+hm(t)};
const whenNext=t=>{if(!t)return'—';if(sameDay(t,Date.now()))return hm(t);if(sameDay(t,Date.now()+864e5))return'I morgen '+hm(t);return cap(DAYS[new Date(t).getDay()])+' '+hm(t)};
const dshort=t=>{const d=new Date(t);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+' '+hm(t)};
const fmtB=b=>b==null?'—':b>=1e12?(b/1e12).toFixed(2)+' TB':b>=1e9?(b/1e9).toFixed(1)+' GB':b>=1e6?Math.round(b/1e6)+' MB':b>=1e3?Math.round(b/1e3)+' kB':b+' B';
const dur=ms=>{if(ms==null||isNaN(ms))return'—';const s=Math.round(ms/1e3);return s>=3600?Math.floor(s/3600)+'t '+p2(Math.floor(s%3600/60))+'m':Math.floor(s/60)+'m '+p2(s%60)+'s'};
const sched=s=>!s?'—':s.type==='hourly'?'Hver time':s.type==='6h'?'Hver 6. time':s.type==='weekly'?`Ukentlig ${DAYS[s.day||0]} ${s.time}`:`Daglig ${s.time}`;

let S=null,view='overview',filter='Alle',restored={},poll=null,SN=null;
function route(){const p=location.pathname.replace(/\/$/,'')||'/';view=Object.keys(VIEWS).find(k=>VIEWS[k][1]===p)||'overview'}
function go(v,f){view=v;if(f!==undefined)filter=f;history.pushState({},'',VIEWS[v][1]);render();if(v==='versions')loadSnaps();window.scrollTo(0,0)}
window.onpopstate=()=>{route();render();if(view==='versions')loadSnaps()};

async function boot(){route();const w=await fetch('/api/whoami').then(r=>r.json());if(!w.authed)return showLogin(w.setup);await refresh();if(view==='versions')loadSnaps()}
function showLogin(setup){clearTimeout(poll);app.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><form id="lf" class="card" style="width:360px;max-width:100%;padding:28px;display:flex;flex-direction:column;gap:14px">
 <div style="display:flex;align-items:center;gap:11px"><div class="logo">↻</div><div style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;font-size:15px">Hytte Backup</span><span style="font-size:11.5px;color:#7d7d86">${setup?'Velg et passord':'Logg inn'}</span></div></div>
 <input class="inp" type="password" id="pw" placeholder="${setup?'Nytt passord (minst 6 tegn)':'Passord'}" autofocus>
 <button class="bp">${setup?'Lagre og fortsett':'Logg inn'}</button><span id="le" style="color:${col('fail')};font-size:12.5px"></span></form></div>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{body:{password:$('#pw').value}});boot()}catch(x){$('#le').textContent=x.message}}}

async function refresh(){try{S=await api('/api/state')}catch(e){return}
 // Ikke tegn om mens brukeren skriver i et felt på siden (innstillinger)
 const a=document.activeElement;if(!(a&&a.tagName==='INPUT'&&app.contains(a)))render();
 clearTimeout(poll);poll=setTimeout(refresh,S.running?1500:8000)}
const jobsC=()=>S.jobs.map((j,i)=>({...j,color:C[i%C.length]}));
const runsH=()=>S.history.filter(h=>h.job!=='system');

function render(){
 if(!S)return;const jobs=jobsC();
 const nav=Object.keys(VIEWS).map(k=>`<button class="nav ${view===k?'on':''}" onclick="go('${k}')"><span style="display:flex;align-items:center;gap:10px"><span class="d"></span>${VIEWS[k][0]}</span><span class="c">${k==='overview'?(jobs.length||''):k==='versions'?(S.snapshotCount||''):''}</span></button>`).join('');
 const c=S.connection,on=c.online;
 app.innerHTML=`<div class="root"><aside>
  <div style="display:flex;align-items:center;gap:11px;padding:0 8px"><div class="logo">↻</div><div style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;font-size:15px;letter-spacing:-.01em">Hytte Backup</span><span style="font-size:11.5px;color:#7d7d86">v${esc(S.version)} · Unraid</span></div></div>
  <nav style="display:flex;flex-direction:column;gap:2px"><span class="lbl" style="color:#5d5d66;padding:0 10px 8px">ARBEIDSOMRÅDE</span>${nav}</nav>
  <div class="cbox" style="margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid #222227;border-radius:10px;background:#131316">
   <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:${col(on?'ok':'fail')};box-shadow:0 0 0 3px ${col(on?'ok':'fail',.18)}"></span>${S.remote.host?(on?'Tilkoblet':'Frakoblet'):'Ikke satt opp'}</div>
   <div class="mono" style="font-size:11.5px;line-height:1.5;color:#8b8b93;word-break:break-all">${S.remote.host?esc(S.remote.user+'@'+S.remote.host):'—'}<br>→ ${esc(S.destRoot)}</div>
   <div style="font-size:11.5px;color:#6b6b74">${on&&c.pingMs!=null?'Ping '+c.pingMs+' ms':esc(S.remote.host?(c.error||'Ingen kontakt'):'Gå til Innstillinger')}${c.zfsVersion?' · ZFS '+esc(c.zfsVersion):c.helper?'':' · ZFS-hjelper mangler'}</div>
  </div></aside>
 <main>
  <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap">
   <div style="display:flex;flex-direction:column;gap:6px"><span class="lbl" style="font-size:11px;color:#6b6b74">HYTTE / ${VIEWS[view][0].toUpperCase()}</span><h1 style="margin:0;font-size:28px;font-weight:600;letter-spacing:-.025em">${VIEWS[view][0]}</h1></div>
   <div style="display:flex;gap:10px"><button class="bs" onclick="runAll()" ${jobs.length?'':'disabled'}>Kjør alle nå</button><button class="bp" onclick="openJob()">+ Ny backup</button></div>
  </header>
  ${view==='overview'?overview():view==='versions'?versionsView():view==='history'?historyView():settingsView()}
 </main></div>`}

function overview(){
 const jobs=jobsC(),H=runsH();
 if(!jobs.length)return`<section class="card empty" style="border-radius:14px;padding:48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:48px;align-items:center">
  <div style="display:flex;flex-direction:column;gap:14px"><span class="lbl" style="font-size:11px;color:#ecc56a">KOM I GANG</span><h2 style="margin:0;font-size:26px;font-weight:600;letter-spacing:-.02em">Ingen backup ennå</h2>
   <p style="margin:0;color:#9a9aa2;font-size:14.5px;line-height:1.6">Trykk «+ Ny backup» og velg en mappe på Unraid. Hytte tar et ZFS-snapshot ved hver kjøring, så du kan gå tilbake til tidligere versjoner.</p>
   <div style="display:flex;gap:10px;margin-top:8px"><button class="bp" style="padding:11px 18px" onclick="openJob()">+ Ny backup</button></div></div>
  <ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px">${step(S.connection.online?'done':'active','01','Koble til Unraid',S.connection.online?esc(S.remote.user+'@'+S.remote.host)+' er tilkoblet':'Legg inn adresse og nøkkel under <a href="#" onclick="go(\'settings\');return false">Innstillinger</a>')}
   ${step(S.connection.online?'active':'idle','02','Velg mappe og tidsplan','F.eks. /mnt/user/photos, daglig kl. 02:00')}${step('idle','03','Første kjøring','Vi varsler deg når den er ferdig')}</ol></section>`;
 const fails=jobs.filter(j=>j.status==='fail'),warns=jobs.filter(j=>j.status==='warn'),okN=jobs.filter(j=>j.status==='ok').length,runN=jobs.filter(j=>j.status==='running').length;
 const recentBad=H.filter(h=>h.start>Date.now()-14*864e5&&h.status!=='ok');
 let b=fails.length?{k:'fail',t:`${fails.length} av ${jobs.length} ${jobs.length===1?'jobb':'jobber'} feilet`,s:fails[0].name+': '+(fails[0].last?.message||'')}
  :warns.length?{k:'warn',t:`${jobs.length-warns.length} av ${jobs.length} jobber er fullt beskyttet`,s:warns[0].name+': '+(warns[0].last?.message||'')}
  :{k:'ok',t:'Alle jobber er beskyttet',s:recentBad.length?'Siste kjøring av alle jobber gikk bra.':'Ingen feil siste 14 dager.'};
 if(!fails.length&&!warns.length&&!okN)b={k:'run',t:runN?'Første backup kjører':'Venter på første kjøring',s:runN?'Et ZFS-snapshot tas når den er ferdig.':'Jobbene kjører etter planen, eller trykk «Kjør nå».'};
 const lastOk=Math.max(0,...H.filter(h=>h.status==='ok').map(h=>h.end||0));
 const nx=jobs.filter(j=>j.nextRun).sort((a,b)=>a.nextRun-b.nextRun)[0];
 const d=S.disk||{size:0,used:0,avail:0},tb=d.size>=1e12,U=x=>tb?(x/1e12).toFixed(2):(x/1e9).toFixed(1),unit=tb?'TB':'GB';
 const segs=jobs.filter(j=>j.sizeBytes).map(j=>`<span style="height:100%;width:${Math.max(.6,j.sizeBytes/d.size*100)}%;background:${j.color}"></span>`).join('');
 const day=H.filter(h=>h.start>Date.now()-864e5&&h.end);
 const t0=new Date();t0.setHours(0,0,0,0);const days=[];for(let i=13;i>=0;i--){const s=t0.getTime()-i*864e5,e=s+864e5,hs=H.filter(h=>h.start>=s&&h.start<e);days.push({s,b:hs.reduce((a,h)=>a+(h.bytes||0),0),bad:hs.some(h=>h.status==='warn'||h.status==='fail'),today:i===0})}
 const mx=Math.max(1,...days.map(x=>x.b)),lab=t=>{const x=new Date(t);return x.getDate()+'. '+MON[x.getMonth()]};
 const ev=[];if(S.running&&S.running.id!=='restore'){const j=jobs.find(x=>x.id===S.running.id);if(j)ev.push({k:'run',t:`${j.name} kjører – snapshot tas når ferdig`,time:hm(Date.now())})}
 for(const h of S.history.slice().reverse()){if(ev.length>=5)break;ev.push({k:ST[h.status]?.k,t:h.job==='system'?h.message:h.status==='ok'?`${h.name} fullført · ${fmtB(h.bytes||0)} overført`:h.status==='warn'?`${h.name} fullført med advarsel`:`${h.name} feilet`,time:sameDay(h.start,Date.now())?hm(h.end||h.start):when(h.end||h.start).replace(/ \d\d:\d\d$/,'')})}
 return`<section style="display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 22px;border:1px solid #23232a;border-radius:12px;background:#141417;flex-wrap:wrap">
  <div style="display:flex;align-items:center;gap:14px;min-width:0"><span style="width:10px;height:10px;border-radius:50%;flex:none;background:${col(b.k)};box-shadow:0 0 0 4px ${col(b.k,.18)}"></span><div style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:15px;font-weight:600">${esc(b.t)}</span><span style="font-size:13px;color:#8b8b93">${esc(b.s)}</span></div></div>

 <div class="db">
  <div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="lbl" style="color:#7d7d86">KILDEMAPPE</span>
    <div class="crumb">${parts[0]==='mnt'&&parts[1]==='user'?`<a onclick="browse('/mnt/user')">/mnt/user</a>${parts.slice(2).map((x,i)=>`<span>/</span><a onclick="browse('/${jsq(parts.slice(0,i+3).join('/'))}')">${esc(x)}</a>`).join('')}`:`<a onclick="browse('/mnt/user')">/mnt/user</a><span>·</span><span>${esc(D.browse)}</span>`}</div></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${shares}</div>
   <form onsubmit="event.preventDefault();typed()" style="display:flex;gap:6px"><input class="inp" id="pp" placeholder="…eller lim inn en sti, f.eks. /mnt/user/Media/immich" value="${esc(D.typed||'')}" oninput="D.typed=this.value" style="font-size:12.5px;padding:8px 10px"><button class="br" type="submit">Bruk</button></form></div>
  <div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl" style="color:#7d7d86">TIDSPLAN</span>
   ${s.type==='daily'||s.type==='weekly'?`<span style="display:flex;gap:6px;align-items:center">${s.type==='weekly'?`<select class="inp" style="width:auto;padding:4px 8px;font-size:12px" onchange="D.schedule.day=+this.value;drawJob()">${DAYS.map((d,i)=>`<option value="${i}" ${+s.day===i?'selected':''}>${d}</option>`).join('')}</select>`:''}<input class="inp" type="time" value="${esc(s.time)}" onchange="D.schedule.time=this.value;drawJob()" style="width:auto;padding:4px 8px;font-size:12px"></span>`:''}</div>
   <div class="seg">${SCH.map(([k,l])=>`<button class="${s.type===k?'on':''}" onclick="D.schedule.type='${k}';drawJob()">${l}</button>`).join('')}</div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl" style="color:#7d7d86">BEHOLD VERSJONER</span><div class="seg">${[7,30,90,365].map(n=>`<button class="${D.retentionDays===n?'on':''}" onclick="D.retentionDays=${n};drawJob()">${n} dager</button>`).join('')}</div></div>
  <div><button onclick="D.adv=!D.adv;drawJob()" style="border:0;background:none;color:#8b8b93;font-size:12.5px;cursor:pointer;padding:0">${D.adv?'▾':'▸'} Avansert</button>
  ${D.adv?`<div style="display:flex;flex-direction:column;gap:14px;margin-top:14px">
   <label class="fl">Navn<input class="inp" value="${esc(D.name)}" oninput="D.name=this.value" placeholder="Fra mappenavnet"></label>
   <div class="fl">Hopp over<div style="display:flex;flex-wrap:wrap;gap:6px">${D.excludes.map((x,i)=>`<span class="chip">${esc(x)}<button onclick="D.excludes.splice(${i},1);drawJob()">✕</button></span>`).join('')}${['thumbs/','encoded-video/','*.tmp','.Trash*/'].filter(x=>!D.excludes.includes(x)).map(x=>`<span class="chip add" onclick="D.excludes.push('${x}');drawJob()">+ ${x}</span>`).join('')}<span class="chip add" onclick="const v=prompt('Mønster, f.eks. cache/ eller *.log');if(v){D.excludes.push(v.trim());drawJob()}">+ eget…</span></div></div>
   <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px"><span>Speil slettinger<br><small style="color:#7d7d86;font-size:12px">Filer slettet på Unraid slettes også her (finnes fortsatt i snapshots)</small></span><button class="tg ${D.mirror?'on':''}" onclick="D.mirror=!D.mirror;drawJob()"><span></span></button></div>
   ${ed?`<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px"><span>Aktiv<br><small style="color:#7d7d86;font-size:12px">Kjører etter planen</small></span><button class="tg ${D.enabled?'on':''}" onclick="D.enabled=!D.enabled;drawJob()"><span></span></button></div>`:''}
   <label class="fl">Båndbreddegrense (f.eks. 10M = 10 MB/s)<input class="inp" value="${esc(D.bwlimit)}" oninput="D.bwlimit=this.value" placeholder="ingen grense"></label>
   ${ed?`<div><button class="br" style="color:${col('fail')}" onclick="delJob()">Slett jobben</button></div>`:''}</div>`:''}</div>
 </div>
 <div class="df"><span class="mono" style="font-size:12px;color:#7d7d86;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${D.src?esc(D.src)+' · '+sched(s).toLowerCase():'Ingen mappe valgt'}</span>
  <div style="display:flex;gap:8px;flex:none"><button class="br" style="padding:9px 14px;font-size:13px" onclick="closeOv()">Avbryt</button><button class="bp" style="padding:9px 16px;font-size:13px" onclick="saveJob()" ${D.src?'':'disabled'}>${ed?'Lagre':'Opprett og kjør'}</button></div></div>
 </div></div>`}
async function browse(p){p=(p||'/mnt/user').replace(/\/+$/,'')||'/';D.browse=p;D.dirs=null;D.err='';drawJob();
 try{const r=await api('/api/browse?path='+encodeURIComponent(p));if(!D||D.browse!==p)return;D.dirs=r.dirs;D.err=r.error||''}catch(e){D.err=e.message}if(ovl.innerHTML)drawJob()}
function pick(path){D.src=path;if(/immich/i.test(path))for(const x of['thumbs/','encoded-video/'])if(!D.excludes.includes(x))D.excludes.push(x);drawJob()}
function typed(){const v=(D.typed||'').trim().replace(/\/+$/,'');if(!v.startsWith('/'))return toast('Stien må starte med /');pick(v);browse(v)}
async function saveJob(){try{const b={...D,runNow:!D.id};delete b.dirs;await api('/api/jobs',{body:b});closeOv();toast(D.id?'Lagret':'Backup opprettet og startet');go('overview');refresh()}catch(e){toast(e.message)}}
async function delJob(){if(!confirm(`Slette jobben «${D.name}»? Filene og snapshotene som allerede er tatt, blir liggende.`))return;await api('/api/jobs/'+D.id,{method:'DELETE'});closeOv();toast('Slettet');refresh()}
boot();
</script>
</body>
</html>
