<style>
:root{--page:#E3E3DE;--canvas:#EEEEEA;--sf:#FFFFFF;--soft:#F6F6F3;--softh:#F0F0EC;--line:#E6E6E1;--ctl:#D8D8D2;--ink:#14161F;--ink2:#4A4D57;--mu:#8A8C93;--fh:#A3A59F;--or:#FF6B3D;--ort:#FFF0E9;--pe:#FFE3D6;--pe2:#FF9F7A;--pet:#C2552B;--bl:#3D6BFF;--bls:#C9D6FF;--ye:#FFD27A;--li:#B9A8FF;--gold:#D9A441;--ok:#4E9A2A;--warn:#E39A2D;--err:#E5484D;--off:#B4B5BA;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Onest,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--ink)}button,input,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--or)}
.m{font-family:var(--mono)}.ic{display:inline-flex;flex:none;line-height:0}
.frame{max-width:1600px;margin:20px auto;background:var(--canvas);border-radius:36px;padding:20px;display:grid;grid-template-columns:84px minmax(0,1fr);gap:20px}
aside{background:var(--sf);border-radius:42px;padding:14px 0;display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:20px;height:calc(100vh - 80px);min-height:560px}
.navb{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;padding:4px 0}
.navb .c{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--sf);color:var(--ink2)}.navb.on .c{background:var(--ink);color:var(--or)}.navb:hover .c{background:var(--soft)}.navb.on:hover .c{background:var(--ink)}
.navb .l{font-size:10.5px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.2;max-width:72px}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:52px;font-weight:600;letter-spacing:-.04em;line-height:1}h1 span{color:var(--fh)}
.card{background:var(--sf);border-radius:32px;padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.dark{background:var(--ink);color:#fff}
.t26{font-size:26px;font-weight:600;letter-spacing:-.02em}.t22{font-size:22px;font-weight:600;letter-spacing:-.02em}.t15{font-size:15px;font-weight:600}
.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mu);text-transform:uppercase}
.mu{color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.bp{display:flex;align-items:center;gap:10px;height:52px;padding:0 10px 0 22px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.bp .ar{width:34px;height:34px;border-radius:50%;background:var(--or);color:var(--ink);display:grid;place-items:center}
.bs{height:48px;padding:0 20px;border-radius:999px;border:1.5px solid var(--ctl);background:transparent;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;color:var(--ink);text-decoration:none}.bs:hover{background:var(--soft)}
.bk{height:48px;padding:0 20px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.cb{border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none}
button:disabled{opacity:.45;cursor:default!important}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.soft{background:var(--soft);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;font-size:13px}.kv>span:nth-child(odd){color:var(--mu)}.kv>span:nth-child(even){text-align:right;font-weight:600;word-break:break-all}
.seg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:999px}.seg button{flex:1;min-width:0;height:40px;border:0;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:var(--ink2);white-space:nowrap;padding:0 10px}.seg button.on{background:var(--or);color:var(--ink)}
.tg{width:52px;height:30px;border-radius:999px;border:0;padding:3px;cursor:pointer;display:flex;flex:none;background:var(--ctl)}.tg.on{background:var(--bl);justify-content:flex-end}.tg span{width:24px;height:24px;border-radius:50%;background:#fff}
.inp{height:48px;padding:0 18px;border-radius:999px;background:var(--soft);border:1.5px solid transparent;outline:none;font:500 13px var(--mono);width:100%;color:var(--ink)}.inp:focus{border-color:var(--ink)}
.nb{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:22px;cursor:pointer;text-align:left;background:var(--soft);border:1.5px solid transparent;width:100%}.nb:hover{background:var(--softh)}
.ov{position:fixed;inset:0;background:rgba(20,22,31,.3);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:50;padding:20px;overflow:auto}
.dlg{width:600px;max-width:100%;background:var(--sf);border-radius:36px;padding:28px;display:flex;flex-direction:column;gap:22px;box-shadow:0 40px 80px rgba(20,22,31,.2)}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,100px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:500;transition:.25s;z-index:60;opacity:0;pointer-events:none}.toast.on{transform:translate(-50%,0);opacity:1}
.fr{display:grid;grid-template-columns:minmax(0,2.4fr) .8fr .9fr .6fr .9fr;gap:12px;align-items:center;height:54px;padding:0 14px 0 8px;border:0;border-radius:999px;text-align:left;cursor:pointer;background:transparent;width:100%}.fr:hover{background:var(--soft)}
.odc .oda{display:none}.odc:hover .oda{display:grid}.odc:hover .odl{visibility:hidden}

.lg-bg{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:0}
.lg{position:relative;min-height:100dvh;display:grid;place-items:center;padding:20px;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#EDEDE8 0%,#E2E2DC 60%,#DDDDD6 100%)}
.lg-arcs{position:absolute;inset:0;width:100%;height:100%}
.lg-s1,.lg-s2{stroke-dasharray:14 86;animation:lgRun 9s linear infinite}.lg-s2{animation-duration:7s;animation-delay:-3s}
@keyframes lgRun{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.lg-a1,.lg-a2{animation:lgBreath 8s ease-in-out infinite}.lg-a2{animation-delay:-4s}
@keyframes lgBreath{50%{stroke-opacity:.95}}
.lg-sweep{animation:lgSweep 14s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes lgSweep{50%{opacity:.18;transform:rotate(14deg) translateX(30px)}}
.lg-shadow{animation:lgShadow 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes lgShadow{50%{transform:scaleX(1.08);opacity:.32}}
.lg-shield{position:absolute;left:10.5%;top:17%;width:clamp(90px,7.8vw,160px);filter:drop-shadow(0 26px 30px rgba(20,22,31,.12));animation:lgFloat 7s ease-in-out infinite}
.lg-shield svg,.lg-cloud svg{display:block;width:100%;height:auto}
@keyframes lgFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
.lg-cloud{position:absolute;right:3.5%;top:46%;width:clamp(200px,21vw,440px);filter:drop-shadow(0 30px 40px rgba(20,22,31,.10));animation:lgDrift 16s ease-in-out infinite}
@keyframes lgDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(-36px,-10px)}}
.lg-mote{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.8);opacity:0;animation:lgMote 13s ease-in-out infinite}
@keyframes lgMote{0%{opacity:0;transform:translateY(20px)}30%,70%{opacity:.9}100%{opacity:0;transform:translateY(-60px)}}
.lg-card{border-radius:40px;box-shadow:0 40px 80px rgba(20,22,31,.10),0 2px 0 rgba(255,255,255,.8) inset;animation:lgIn .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes lgIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
@media(max-width:700px){.lg-shield{left:6%;top:6%}.lg-cloud{right:-12%;top:auto;bottom:6%}}
@media(prefers-reduced-motion:reduce){.lg *,.lg{animation:none!important}}
.dirrow{display:flex;align-items:center;gap:12px;height:48px;padding:0 8px;border:0;border-radius:999px;cursor:pointer;background:transparent;width:100%;text-align:left}.dirrow:hover{background:var(--soft)}

:root{--pad:clamp(12px,1.2vw,24px);--gap:clamp(12px,1vw,20px)}
body{font-size:clamp(13px,.85vw,15px)}
.frame{width:100%;max-width:2400px;margin:0 auto;border-radius:0;padding:var(--pad);gap:var(--gap);grid-template-columns:clamp(72px,5vw,96px) minmax(0,1fr);min-height:100dvh}
@media(min-width:2440px){.frame{margin:var(--pad) auto;border-radius:36px;min-height:0}}
aside{top:var(--pad);height:calc(100dvh - 2*var(--pad));min-height:0}
main{container-type:inline-size;gap:var(--gap)}
h1{font-size:clamp(32px,3.2vw,64px)}
.big{font-size:clamp(48px,5vw,96px)}
.t26{font-size:clamp(20px,1.6vw,30px)}.t22{font-size:clamp(18px,1.4vw,28px)}
.row{gap:var(--gap)}
.card{min-width:0}
.scrollc{max-height:clamp(420px,60dvh,900px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--ctl) transparent}
.bento{display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr)}
.ga-hero{grid-area:hero}.ga-spart{grid-area:spart}.ga-boble{grid-area:boble}.ga-kjor{grid-area:kjor}.ga-s24{grid-area:s24}.ga-koord{grid-area:koord}.ga-noder{grid-area:noder}.ga-det{grid-area:det}.ga-tl{grid-area:tl}.ga-kap{grid-area:kap}.ga-cta{grid-area:cta}
.bento{grid-template-areas:"hero" "spart" "boble" "kjor" "s24" "koord" "noder" "det" "tl" "kap" "cta"}
@container (min-width:800px){.bento{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"hero hero" "spart boble" "kjor s24" "koord koord" "noder noder" "det kap" "tl tl" "cta cta"}}
@container (min-width:1200px){.bento{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"hero hero spart" "hero hero boble" "kjor s24 koord" "noder noder det" "tl tl kap" "tl tl cta"}}
@container (min-width:1800px){.bento{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-areas:"hero hero spart kjor" "hero hero boble s24" "hero hero boble koord" "noder noder noder det" "tl tl kap cta"}}
.ga-det{align-self:start}
header label{flex:1 1 240px;max-width:420px}header input{width:100%!important}
@media(max-width:800px){.frame{grid-template-columns:minmax(0,1fr);padding:10px 10px 92px}
 aside{position:fixed;left:10px;right:10px;bottom:10px;top:auto;height:72px;flex-direction:row;justify-content:space-around;padding:8px;border-radius:999px;z-index:40;box-shadow:0 10px 30px rgba(20,22,31,.12)}
 aside>div:first-child{display:none!important}aside .navb{flex-direction:row;gap:6px;margin:0!important}aside .navb .c{width:44px;height:44px}aside .navb .l{display:none}aside .navb.on .l{display:block;font-size:12px}aside .navb.on{padding-right:14px;background:var(--soft);border-radius:999px}
 .fr{grid-template-columns:minmax(0,1fr) auto!important}.fr>span:nth-child(n+3):not(:nth-child(4)){display:none}.fr>span:nth-child(2){display:none}}
</style>

<body>
<div id="app"></div><div id="ovl"></div><div class="toast" id="toast"></div>
<script>
const I=(name,sz=16,sw=1.75)=>{const L=window.lucide&&lucide.icons,n=L&&L[name.replace(/(^|-)([a-z0-9])/g,(_,a,b)=>b.toUpperCase())];if(!n)return`<span class="ic" style="width:${sz}px;height:${sz}px"></span>`;
 const kids=(n[0]==='svg'?n[2]:n).map(([t,a])=>`<${t} ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(' ')}/>`).join('');
 return`<span class="ic"><svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="display:block">${kids}</svg></span>`};
const $=s=>document.querySelector(s),app=$('#app'),ovl=$('#ovl');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jq=s=>esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800)};
async function api(u,o={}){const r=await fetch(u,{method:o.method||(o.body?'POST':'GET'),headers:{'Content-Type':'application/json'},body:o.body&&JSON.stringify(o.body)});const j=await r.json().catch(()=>({}));
 if(r.status===401&&u!=='/api/login'){showLogin(false);throw new Error('auth')}if(!r.ok)throw new Error(j.error||r.statusText);return j}
const p2=n=>String(n).padStart(2,'0'),hm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())},hms=t=>hm(t)+':'+p2(new Date(t).getSeconds());
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const fB=b=>b==null?'—':b>=1e12?(b/1e12).toFixed(2)+' TB':b>=1e9?(b/1e9).toFixed(1)+' GB':b>=1e6?(b/1e6).toFixed(b>=1e8?0:1)+' MB':b>=1e3?Math.round(b/1e3)+' kB':b+' B';
const ago=t=>{if(!t)return'—';const s=(Date.now()-t)/1e3;return s<60?'nå':s<3600?Math.round(s/60)+' min siden':s<86400?'for '+Math.round(s/3600)+' t siden':'for '+Math.round(s/86400)+' d siden'};
const DAYS=['søn','man','tir','ons','tor','fre','lør'],DAYL=['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'],MON=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const sched=s=>!s?'—':s.type==='hourly'?'Hver time':s.type==='6h'?'Hver 6. time':s.type==='weekly'?`Ukentlig ${DAYS[s.day||0]} ${s.time}`:`Daglig ${s.time}`;
const ST={ok:['OK','var(--ok)'],running:['Kjører','var(--bl)'],queued:['I kø','var(--bl)'],scheduled:['Planlagt','var(--mu)'],warn:['Advarsel','var(--warn)'],fail:['Feilet','var(--err)'],waiting:['Venter på node','var(--off)']};
const VIEWS={overview:['Oversikt','network','/'],sync:['Synk','hard-drive','/synk'],files:['Filer','folder-archive','/filer'],settings:['Innstillinger','settings-2','/innstillinger']};
const LOCC=['var(--or)','var(--bl)','var(--ye)'],LOCH=['#FF6B3D','#3D6BFF','#FFD27A'];
const nodeIcon=n=>{const s=(n.name+' '+(n.os||'')).toLowerCase();return/db|postgres|sql/.test(s)?'database':/nas|unraid|truenas|synology/.test(s)?'hard-drive-download':/mac|mbp|ios|ipad/.test(s)?'laptop':/windows|pc/.test(s)?'monitor':'server'};
const SKJOLD=(h=40)=>{const k=h/40;return`<span title="Skjold Lab" style="display:flex;align-items:flex-end;gap:${5*k}px;height:${h}px">${[20,29,40,29,20].map((x,i)=>`<span style="width:${6*k}px;height:${x*k}px;border-radius:${3*k}px;background:${i===2?'var(--gold)':'var(--ink)'}"></span>`).join('')}</span>`};

let S=null,view='overview',selNode=null,selDay=null,poll=null,X={job:null,snaps:null,snap:null,path:[],ls:null,file:null,stat:null,preview:null,target:null,targetPath:'',restoreKey:null,dl:false},search='',pinged={};
function route(){const p=location.pathname.replace(/\/$/,'')||'/';view=Object.keys(VIEWS).find(k=>VIEWS[k][2]===p)||'overview'}
function go(v){view=v;history.pushState({},'',VIEWS[v][2]);render();if(v==='files')initFiles();window.scrollTo(0,0)}
window.onpopstate=()=>{route();render();if(view==='files')initFiles()};
async function boot(){route();const w=await fetch('/api/whoami').then(r=>r.json());if(!w.authed)return showLogin(w.setup);await refresh();if(view==='files')initFiles();sse()}
function showLogin(setup){clearTimeout(poll);app.innerHTML=`<div class="lg"><iframe class="lg-bg" src="/ambient.html?bare-bakgrunn" title="" aria-hidden="true" tabindex="-1"></iframe>
 <form id="lf" class="card lg-card" style="width:min(420px,100%);padding:36px 40px 40px;gap:20px;position:relative;z-index:2">
 <div style="display:flex;align-items:center;gap:14px">${SKJOLD(30)}<div style="display:flex;flex-direction:column;line-height:1.2"><span style="font-weight:700;letter-spacing:.14em;font-size:12px">HYTTE</span><span style="font-weight:600;letter-spacing:.1em;font-size:10px;color:var(--mu)">SKJOLD LAB</span></div></div>
 <span class="t22">${setup?'Velg et passord':'Logg inn'}</span><input class="inp" type="password" id="pw" autocomplete="current-password" enterkeyhint="go" placeholder="${setup?'Minst 6 tegn':'Passord'}" autofocus>
 <button type="submit" class="bp" style="justify-content:space-between">${setup?'Lagre og fortsett':'Logg inn'}<span class="ar">${I('arrow-right',16,2)}</span></button><span id="le" style="color:var(--err);font-size:13px"></span></form></div>`;
 const pw=$('#pw');pw.focus();pw.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#lf').requestSubmit()}};$('#lf').onsubmit=async e=>{e.preventDefault();if(!pw.value)return;try{await api('/api/login',{body:{password:$('#pw').value}});boot()}catch(x){$('#le').textContent=x.message}}}
async function refresh(){try{[S]=await Promise.all([api('/api/state'),loadDevices()])}catch(e){return}const a=document.activeElement;if(!$('aside')||!(a&&a.tagName==='INPUT'&&app.contains(a)))render();clearTimeout(poll);poll=setTimeout(refresh,S.running?2000:10000)}
let rt=null;const soon=()=>{clearTimeout(rt);rt=setTimeout(refresh,300)};
function sse(){try{const es=new EventSource('/api/events');es.addEventListener('coord.log',e=>{S&&S.log.push(JSON.parse(e.data));if(view==='sync')drawLog();soon()});
 es.addEventListener('job.status',soon);es.addEventListener('node.status',e=>{const d=JSON.parse(e.data);for(const L of[TD,S&&S.nodes])if(L){const n=L.find(x=>x.name===d.name);if(n)Object.assign(n,d)}if(view==='overview'&&!(document.activeElement&&document.activeElement.id==='odq'))render()});es.addEventListener('job.progress',e=>{const d=JSON.parse(e.data);if(S&&S.running&&S.running.id===d.id){S.running.pct=d.pct;S.running.phase=d.phase;const j=S.jobs.find(x=>x.id===d.id);if(j){j.progress=d.pct;j.phase=d.phase}const a=document.activeElement;if(view==='overview'&&!(a&&a.tagName==='INPUT'))render()}});
 es.addEventListener('restore.progress',e=>{const d=JSON.parse(e.data);if(S){S.restores[d.key]={...(S.restores[d.key]||{}),pct:d.pct,status:d.status||'running'};if(view==='files')drawPreview()}if(d.status)soon()});}catch(e){}}

// ── Avledet ──
const src=()=>S.nodes.filter(n=>n.name!==S.self.name);
const vault=()=>({...S.self,loc:(S.nodes.find(n=>n.name===S.self.name)||{}).loc||'',role:'Leder'});
function locs(){const has=new Set(S.jobs.map(j=>j.node)),m={};for(const n of src()){const l=n.loc||(has.has(n.name)?'Kilder':'Tailnet');(m[l]=m[l]||[]).push(n)}
 const keys=Object.keys(m).sort((a,b)=>(a==='Tailnet')-(b==='Tailnet')||a.localeCompare(b,'nb'));return keys.map((k,i)=>({loc:k,nodes:m[k],c:k==='Tailnet'?'#D8D8D2':LOCH[i]||'#D8D8D2'}))}
const locColorOfNode=name=>{const g=locs().find(g=>g.nodes.some(n=>n.name===name));return g?g.c:'#D8D8D2'};
function render(){if(!S)return;const d=new Date(),tn=S.tailnet;
 app.innerHTML=`<div class="frame"><aside>
  <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 14px;margin-bottom:6px;border-bottom:1px solid var(--line);width:56px">${SKJOLD()}<span style="font-size:10px;font-weight:700;letter-spacing:.14em;margin-top:6px">HYTTE</span><span style="font-size:8.5px;font-weight:600;letter-spacing:.1em;color:var(--mu);white-space:nowrap">SKJOLD LAB</span></div>

  <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Kildenode</span><div style="display:flex;gap:6px;flex-wrap:wrap">${jobNodeList().map(n=>`<button onclick="J.node='${jq(n.name)}';J.path='';jBrowse('/mnt/user')" style="display:flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;border:1.5px solid ${J.node===n.name?'var(--ink)':'var(--line)'};background:${J.node===n.name?'var(--ort)':'#fff'}"><span class="dot" style="background:${n.online?'var(--ok)':'var(--off)'}"></span>${esc(n.name)}</button>`).join('')}<button onclick="openNode()" style="display:flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;border:1.5px dashed var(--ctl);background:transparent">${I('plus',14)}Annen vert</button></div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Mappe</span>
   <div style="display:flex;align-items:center;gap:2px;padding:6px;background:var(--soft);border-radius:999px;overflow-x:auto"><button onclick="jBrowse('/')" style="border:0;background:none;padding:6px 10px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--mu)">/</button>${crumbs.map((c,i)=>`<button onclick="jBrowse('/${jq(crumbs.slice(0,i+1).join('/'))}')" style="border:0;background:none;padding:6px 10px;border-radius:999px;font-weight:600;cursor:pointer;color:${i===crumbs.length-1?'var(--ink)':'var(--mu)'}">${esc(c)}</button>${i<crumbs.length-1?`<span style="color:#CFCFCA">${I('chevron-right',13)}</span>`:''}`).join('')}<button class="pill" style="margin-left:auto;border:0;cursor:pointer;background:#fff" onclick="jPick(J.browse)">Velg denne</button></div>
   <div style="max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:2px">${dirs}</div>
   <form onsubmit="event.preventDefault();const v=this.p.value.trim().replace(/\\/+$/,'');if(v.startsWith('/')){jPick(v);jBrowse(v)}" style="display:flex;gap:6px"><input class="inp" name="p" placeholder="…eller lim inn en sti, f.eks. /mnt/user/Media/immich" style="height:44px"><button class="bs" style="height:44px">Bruk</button></form></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Jobb-ID</span><input class="inp" style="height:44px" value="${esc(J.id)}" oninput="J.id=this.value" placeholder="${esc(J.node&&J.path?(J.node+'-'+J.path.split('/').pop()).toLowerCase():'f.eks. nas-bilder')}"></label>
   <label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Klokkeslett</span><input class="inp" style="height:44px" type="time" value="${esc(s.time)}" onchange="J.schedule.time=this.value" ${s.type==='hourly'?'disabled':''}></label></div>
  <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Plan</span>${segH([['hourly','Hver time'],['6h','Hver 6. time'],['daily','Daglig'],['weekly','Ukentlig']],s.type,'jSet.t')}${s.type==='weekly'?segH(DAYS.map((d,i)=>[i,d]),s.day,'jSet.d'):''}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Komprimering</span>${segH([[1,'zstd-1'],[3,'3'],[9,'9'],[19,'19']],J.level,'jSet.l')}</div><div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Behold versjoner</span>${segH([[7,'7 d'],[30,'30 d'],[90,'90 d'],[365,'1 år']],J.retentionDays,'jSet.r')}</div></div>
  <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Hopp over</span><div style="display:flex;flex-wrap:wrap;gap:6px">${J.excludes.map((x,i)=>`<span class="pill m" style="background:var(--ort);font-weight:500">${esc(x)}<span style="cursor:pointer;color:var(--mu)" onclick="J.excludes.splice(${i},1);drawJob()">${I('x',12)}</span></span>`).join('')}${['thumbs/','encoded-video/','*.tmp','.Trash*/','cache/'].filter(x=>!J.excludes.includes(x)).map(x=>`<span class="pill m" style="cursor:pointer;font-weight:500" onclick="J.excludes.push('${x}');drawJob()">${I('plus',12)}${x}</span>`).join('')}<span class="pill" style="cursor:pointer" onclick="const v=prompt('Mønster, f.eks. logs/ eller *.iso');if(v){J.excludes.push(v.trim());drawJob()}">${I('plus',12)}eget…</span></div></div>
  ${ed?`<div style="display:flex;justify-content:space-between;align-items:center;gap:16px"><div style="display:flex;flex-direction:column;gap:4px"><span class="t15">Aktiv</span><span class="mu" style="font-size:12.5px">Kjører etter planen</span></div><button class="tg ${J.enabled?'on':''}" onclick="J.enabled=!J.enabled;drawJob()"><span></span></button></div>`:''}`,
  `${ed?`<button class="bs" style="color:var(--err)" onclick="delJob()">${I('trash-2',15)}Slett</button>`:''}<button class="bs" style="margin-left:auto" onclick="closeOv()">Avbryt</button><button class="bp" onclick="saveJob()" ${J.node&&J.path?'':'disabled'}>${ed?'Lagre':'Opprett og kjør'}<span class="ar">${I('arrow-right',16,2)}</span></button>`,680)}
function jobNodeList(){const K=Object.fromEntries((TD||[]).map(d=>[d.name,d.kind])),used=new Set(S.jobs.map(j=>j.node));return src().filter(n=>n.name===J.node||used.has(n.name)||(n.online&&K[n.name]!=='mobile'&&K[n.name]!=='tablet')).sort((a,b)=>used.has(b.name)-used.has(a.name))}
const jSet={t:v=>{J.schedule.type=v;drawJob()},d:v=>{J.schedule.day=+v;drawJob()},l:v=>{J.level=+v;drawJob()},r:v=>{J.retentionDays=+v;drawJob()}};
async function jBrowse(p){p=(p||'/').replace(/\/+$/,'')||'/';J.browse=p;J.dirs=null;J.err='';drawJob();try{const r=await api(`/api/browse?node=${encodeURIComponent(J.node)}&path=${encodeURIComponent(p)}`);if(J.browse!==p)return;if(r.error&&/No such file/.test(r.error)&&p==='/mnt/user')return jBrowse('/');J.dirs=r.dirs;J.err=r.error||''}catch(e){J.err=e.message}if(ovl.innerHTML&&J)drawJob()}
function jPick(p){J.path=p;if(/immich/i.test(p))for(const x of['thumbs/','encoded-video/'])if(!J.excludes.includes(x))J.excludes.push(x);drawJob()}
async function saveJob(){try{await api('/api/jobs',{body:{...J,dirs:undefined,runNow:!J.orig}});closeOv();toast(J.orig?'Lagret':'Jobben er opprettet og startet');refresh()}catch(e){toast(e.message)}}
async function delJob(){if(!confirm(`Slette jobben ${J.orig}? Arkivet og snapshotene blir liggende.`))return;await api('/api/jobs/'+encodeURIComponent(J.orig),{method:'DELETE'});closeOv();toast('Slettet');refresh()}
let backToJob=false;
function openNode(name){backToJob=!!(J&&ovl.innerHTML&&!name);const n=name&&S.nodes.find(x=>x.name===name)||{};const isNew=!name;
 dlg(isNew?'Legg til vert':esc(name),'server',isNew?'For maskiner som ikke er på tailnetet.':'Lokasjon og SSH-tilgang',`${isNew?`<label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Navn</span><input class="inp" id="nn" placeholder="f.eks. gammel-nas"></label><label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Adresse</span><input class="inp" id="nh" placeholder="IP eller vertsnavn"></label>`:''}
  <div style="display:grid;grid-template-columns:1.2fr 1fr .6fr;gap:12px"><label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Lokasjon</span><input class="inp" id="nl" value="${esc(n.loc||'')}" placeholder="f.eks. Hjemme"></label><label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">SSH-bruker</span><input class="inp" id="nu" value="${esc(n.user||'root')}"></label><label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Port</span><input class="inp" id="np" value="${esc(n.port||22)}"></label></div>
  <div id="nt" style="font-size:12.5px"></div>`,
  `${isNew?'':`<button class="bs" onclick="testNode('${jq(name)}')">${I('plug',15)}Test SSH</button>`}<button class="bs" style="margin-left:auto" onclick="closeNode()">Avbryt</button><button class="bk" onclick="saveNode(${isNew?'null':`'${jq(name)}'`})">Lagre</button>`,560)}
function closeNode(){if(backToJob){backToJob=false;drawJob()}else closeOv()}
async function saveNode(name){const b={loc:$('#nl').value,user:$('#nu').value,port:$('#np').value};if(!name){name=$('#nn').value.trim();b.host=$('#nh').value.trim();if(!name||!b.host)return toast('Fyll inn navn og adresse')}
 await api('/api/nodes/'+encodeURIComponent(name),{method:'PATCH',body:b});toast('Lagret');await refresh();if(backToJob){backToJob=false;J.node=name;J.path='';jBrowse('/mnt/user')}else closeOv()}
async function testNode(name){await api('/api/nodes/'+encodeURIComponent(name),{method:'PATCH',body:{loc:$('#nl').value,user:$('#nu').value,port:$('#np').value}});$('#nt').innerHTML='<span class="mu">Kobler til…</span>';const r=await api('/api/nodes/'+encodeURIComponent(name)+'/test',{method:'POST'});$('#nt').innerHTML=r.ok?`<span style="color:var(--ok);font-weight:600">✓ ${esc(r.info.join(' · '))}</span>`:`<span style="color:var(--err)">✕ ${esc(r.error)}</span>`}
function openVault(){const c=unassigned();
 dlg('Nytt backupsted','hard-drive','Velg en enhet på tailnet som skal lagre kopier.',`<div style="display:flex;flex-direction:column;gap:6px">${c.length?c.map(n=>`<div style="display:grid;grid-template-columns:22px 1.2fr 1fr .8fr;gap:12px;align-items:center;min-height:58px;padding:0 18px;border-radius:999px;background:var(--soft)"><span style="width:20px;height:20px;border-radius:50%;border:2px solid var(--ctl)"></span><span style="font-weight:600">${esc(n.name)}</span><span class="m mu" style="font-size:12px">${esc(n.ip)}</span><span class="mu" style="font-size:13px">${esc(n.loc||n.os||'')}</span></div>`).join(''):'<span class="mu">Ingen ledige enheter på tailnetet.</span>'}</div>
  <div style="background:var(--soft);border-radius:24px;padding:16px 18px;font-size:13px;color:var(--ink2);line-height:1.6">Flere backupsteder med leder, kvorum og replikering mellom seg kommer i neste versjon. Da installerer du Hytte på enheten og velger den her.</div>`,
  `<button class="bs" style="margin-left:auto" onclick="closeOv()">Avbryt</button><button class="bp" disabled>Legg til og synk<span class="ar">${I('arrow-right',16,2)}</span></button>`)}
boot();
</script>
</body>
</html>
