<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hytte</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2318181B' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><rect width='20' height='5' x='2' y='3' rx='1'/><path d='M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8'/><path d='M10 12h4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/vendor/lucide.min.js"></script>
<style>
:root{--bg:#F9F9F8;--sf:#FFFFFF;--line:#E4E4E7;--row:#F0F0EF;--ctl:#DCDCE0;--t:#18181B;--t2:#3F3F46;--mu:#71717A;--fa:#A1A1AA;--ok:#2F9E6B;--okl:#B9DCC9;--warn:#B7791F;--err:#C53030;--mono:ui-monospace,'SF Mono','IBM Plex Mono',monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
a{color:var(--ok);text-decoration:none}button,input,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:rgba(24,24,27,.1)}
.m{font-family:var(--mono)}
.lbl{font:500 10.5px var(--mono);letter-spacing:.06em;color:var(--fa)}
.ic{display:inline-flex;flex:none;line-height:0}
.root{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--bg)}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border:0;border-radius:6px;cursor:pointer;font-size:13px;text-align:left;background:transparent;color:var(--mu);width:100%}
.nav:hover{background:#F4F4F3;color:var(--t)}.nav.on{background:#EFEFEE;color:var(--t)}
.nav .c{margin-left:auto;font:400 11px var(--mono);color:var(--fa)}
header.top{height:60px;display:flex;align-items:center;gap:14px;padding:0 48px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.content{padding:40px 48px 72px;display:flex;flex-direction:column;gap:32px;max-width:1480px;width:100%}
.b1,.b2{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.b1{border:1px solid var(--t);background:var(--t);color:#fff;font-weight:500}.b1:hover{background:var(--t2)}
.b2{border:1px solid var(--ctl);background:var(--sf);color:var(--t)}.b2:hover{background:#F4F4F3}
.bi{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--ctl);border-radius:6px;background:transparent;color:var(--t2);cursor:pointer}.bi:hover{background:#F4F4F3;color:var(--t)}
button:disabled{opacity:.45;cursor:default!important}
.pnl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sf)}
.ph{height:56px;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid var(--line)}.ph b{font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sf)}
.kpi{padding:22px 24px;display:flex;flex-direction:column;gap:8px;min-width:0;border-right:1px solid var(--line);margin-right:-1px;border-bottom:1px solid var(--line);margin-bottom:-1px}
.kpi .k{font-size:12px;color:var(--mu)}.kpi .v{font-weight:600;font-size:26px;letter-spacing:-.025em}.kpi .s{font:400 11.5px var(--mono);color:var(--fa);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis.sm .v{font-size:18px;letter-spacing:-.015em}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:12px}.kv>span:nth-child(odd){color:var(--mu)}.kv>span:nth-child(even){font-family:var(--mono);text-align:right;word-break:break-all}
.th,.trow{display:grid;gap:12px;align-items:center;padding:0 22px}
.th{height:40px;border-bottom:1px solid var(--line);font:500 10.5px var(--mono);letter-spacing:.05em;color:var(--fa)}
.trow{min-height:58px;padding-top:8px;padding-bottom:8px;border-bottom:1px solid var(--row)}.trow:hover{background:#F7F7F6}.trow:last-child{border-bottom:0}
.gjob{grid-template-columns:minmax(200px,1.7fr) minmax(200px,1.7fr) .9fr .6fr .6fr .7fr .7fr 1.2fr 1fr 44px}
.gvault{grid-template-columns:1.3fr .8fr 1fr .8fr 1.3fr .6fr .8fr}
.tab{height:26px;padding:0 10px;border:0;border-radius:5px;cursor:pointer;font-size:12px;background:transparent;color:var(--mu)}.tab.on{background:#F0F0EF;color:var(--t)}
.seg{display:flex;border:1px solid var(--ctl);border-radius:6px;overflow:hidden}.seg button{flex:1;height:28px;border:0;border-right:1px solid var(--ctl);margin-right:-1px;cursor:pointer;font-size:12px;background:var(--sf);color:var(--mu);white-space:nowrap;padding:0 8px}.seg button.on{background:#F0F0EF;color:var(--t)}
.inp{height:32px;padding:0 10px;border:1px solid var(--ctl);border-radius:6px;background:var(--sf);font:400 12.5px var(--mono);outline:none;width:100%}.inp:focus{border-color:var(--t)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:5px;cursor:pointer;font:400 11px var(--mono);white-space:nowrap;border:1px solid var(--ctl);background:var(--sf);color:var(--t2)}
.chip.on{border-color:var(--ok);background:rgba(47,158,107,.07);color:var(--t)}
.ov{position:fixed;inset:0;background:rgba(24,24,27,.16);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:20px;overflow:auto}
.dlg{width:640px;max-width:100%;background:var(--sf);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(24,24,27,.12);overflow:hidden}
.dh{height:60px;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid var(--line)}.dh b{font-weight:600;font-size:14px}
.db{padding:20px 22px;display:flex;flex-direction:column;gap:18px;max-height:66vh;overflow:auto}
.df{padding:14px 22px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;background:var(--bg)}
.fld{display:flex;flex-direction:column;gap:8px}
.tg{width:34px;height:20px;border-radius:10px;border:0;padding:2px;cursor:pointer;display:flex;background:var(--ctl);flex:none}.tg.on{background:var(--ok);justify-content:flex-end}.tg span{width:16px;height:16px;border-radius:50%;background:#fff}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:var(--t);color:#fff;padding:9px 14px;border-radius:8px;font-size:12.5px;transition:.25s;z-index:60}.toast.on{transform:translate(-50%,0)}
.hatch{background:repeating-linear-gradient(135deg,#FAFAF9 0 8px,#F3F3F2 8px 16px)}
pre.code{margin:0;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:400 11.5px/1.6 var(--mono);color:var(--t2);white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}
.row{display:grid;grid-template-columns:minmax(0,2.4fr) .8fr .8fr .6fr .9fr;gap:12px;align-items:center;height:42px;padding:0 18px;border:0;border-bottom:1px solid var(--row);text-align:left;cursor:pointer;background:transparent;width:100%}.row:hover{background:#F7F7F6}
@media(max-width:900px){.root{grid-template-columns:1fr}aside{position:static;height:auto}header.top,.content{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
<div id="app"></div><div id="ovl"></div><div class="toast" id="toast"></div>
<script>
// ── Ikoner (lucide) ──
const I=(name,sz=15,sw=1.5)=>{const L=window.lucide&&lucide.icons,n=L&&L[name.replace(/(^|-)([a-z0-9])/g,(_,a,b)=>b.toUpperCase())];if(!n)return`<span class="ic" style="width:${sz}px;height:${sz}px"></span>`;
 const kids=(n[0]==='svg'?n[2]:n).map(([t,a])=>`<${t} ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(' ')}/>`).join('');
 return`<span class="ic"><svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="display:block">${kids}</svg></span>`};
const $=s=>document.querySelector(s),app=$('#app'),ovl=$('#ovl');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jq=s=>esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800)};
async function api(u,o={}){const r=await fetch(u,{method:o.method||(o.body?'POST':'GET'),headers:{'Content-Type':'application/json'},body:o.body&&JSON.stringify(o.body)});const j=await r.json().catch(()=>({}));
 if(r.status===401&&u!=='/api/login'){showLogin(false);throw new Error('auth')}if(!r.ok)throw new Error(j.error||r.statusText);return j}
const p2=n=>String(n).padStart(2,'0'),hm=t=>{const d=new Date(t);return p2(d.getHours())+':'+p2(d.getMinutes())},hms=t=>{const d=new Date(t);return hm(t)+':'+p2(d.getSeconds())};
const dm=t=>{const d=new Date(t);return p2(d.getDate())+'.'+p2(d.getMonth()+1)};
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const fB=b=>b==null?'—':b>=1e12?(b/1e12).toFixed(2)+' TB':b>=1e9?(b/1e9).toFixed(1)+' GB':b>=1e6?(b/1e6).toFixed(b>=1e8?0:1)+' MB':b>=1e3?Math.round(b/1e3)+' kB':b+' B';
const ago=t=>{if(!t)return'—';const s=(Date.now()-t)/1e3;return s<60?'nå':s<3600?Math.round(s/60)+' min siden':s<86400?Math.round(s/3600)+' t siden':Math.round(s/86400)+' d siden'};
const DAYS=['søn','man','tir','ons','tor','fre','lør'];
const sched=s=>!s?'—':s.type==='hourly'?'Hver time':s.type==='6h'?'Hver 6. time':s.type==='weekly'?`Ukentlig ${DAYS[s.day||0]} ${s.time}`:`Daglig ${s.time}`;
const nextL=t=>!t?'—':sameDay(t,Date.now())?hm(t):sameDay(t,Date.now()+864e5)?'i morgen':DAYS[new Date(t).getDay()]+' '+hm(t);
const ST={ok:['OK','var(--ok)'],running:['Kjører','var(--ok)'],queued:['I kø','var(--ok)'],scheduled:['Planlagt','var(--mu)'],warn:['Advarsel','var(--warn)'],fail:['Feilet','var(--err)'],waiting:['Venter på node','var(--fa)']};
const VIEWS={overview:['Oversikt & Noder','network','/'],vaults:['Backupsteder & Synk','hard-drive','/backupsteder'],files:['Komprimert Filutforsker','folder-archive','/filer']};
const nodeIcon=n=>{const s=(n.name+' '+(n.os||'')+' '+(n.type||'')).toLowerCase();return/db|postgres|sql/.test(s)?'database':/nas|unraid|truenas|synology/.test(s)?'hard-drive-download':/mac|mbp|ios|ipad/.test(s)?'laptop':/windows|pc|desk/.test(s)?'monitor':/android|phone|iphone/.test(s)?'smartphone':'server'};

let S=null,view='overview',selNode=null,jobTab='Alle',poll=null,X={job:null,snaps:null,snap:null,path:[],ls:null,file:null,stat:null,preview:null,target:null,targetPath:'',restoreKey:null,dl:false},search='';
function route(){const p=location.pathname.replace(/\/$/,'')||'/';view=Object.keys(VIEWS).find(k=>VIEWS[k][2]===p)||'overview'}
function go(v){view=v;history.pushState({},'',VIEWS[v][2]);render();if(v==='files')initFiles();window.scrollTo(0,0)}
window.onpopstate=()=>{route();render();if(view==='files')initFiles()};

async function boot(){route();const w=await fetch('/api/whoami').then(r=>r.json());if(!w.authed)return showLogin(w.setup);await refresh();if(view==='files')initFiles();sse()}
function showLogin(setup){clearTimeout(poll);app.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><form id="lf" class="pnl" style="width:340px;padding:24px;display:flex;flex-direction:column;gap:14px">
 <div style="display:flex;align-items:center;gap:10px"><span style="width:24px;height:24px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center">${I('archive',13)}</span><b style="font-size:14px">Hytte</b><span class="m" style="margin-left:auto;color:var(--fa);font-size:11px">${setup?'Velg passord':'Logg inn'}</span></div>
 <input class="inp" type="password" id="pw" placeholder="${setup?'Nytt passord (minst 6 tegn)':'Passord'}" autofocus><button class="b1" style="height:32px">${setup?'Lagre og fortsett':'Logg inn'}</button><span id="le" style="color:var(--err);font-size:12px"></span></form></div>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{body:{password:$('#pw').value}});boot()}catch(x){$('#le').textContent=x.message}}}
async function refresh(){try{S=await api('/api/state')}catch(e){return}const a=document.activeElement;if(!(a&&a.tagName==='INPUT'&&app.contains(a)))render();clearTimeout(poll);poll=setTimeout(refresh,S.running?2000:10000)}
let rt=null;const soon=()=>{clearTimeout(rt);rt=setTimeout(refresh,300)};
function sse(){try{const es=new EventSource('/api/events');es.addEventListener('coord.log',e=>{S&&S.log.push(JSON.parse(e.data));if(view==='vaults')drawLog();soon()});
 es.addEventListener('job.status',soon);es.addEventListener('job.progress',e=>{const d=JSON.parse(e.data);if(S&&S.running&&S.running.id===d.id){S.running.pct=d.pct;S.running.phase=d.phase;const j=S.jobs.find(x=>x.id===d.id);if(j){j.progress=d.pct;j.phase=d.phase}const a=document.activeElement;if(view==='overview'&&!(a&&a.tagName==='INPUT')&&!ovl.innerHTML)render()}});
 es.addEventListener('restore.progress',e=>{const d=JSON.parse(e.data);if(S){S.restores[d.key]={...(S.restores[d.key]||{}),pct:d.pct,status:d.status||'running'};if(view==='files')drawPreview()}if(d.status)soon()});es.onerror=()=>{}}catch(e){}}

// ── Avledet ──
const vaults=()=>[{...S.self,role:'Leder',loc:(S.nodes.find(n=>n.name===S.self.name)||{}).loc||'',vault:true}];
const sources=()=>S.nodes.filter(n=>n.name!==S.self.name);
function render(){if(!S)return;
 const tn=S.tailnet,suffix=tn.suffix||'',crumb=suffix.split('.')[0]||'hytte';
 const nav=Object.keys(VIEWS).map(k=>`<button class="nav ${view===k?'on':''}" onclick="go('${k}')">${I(VIEWS[k][1])}<span>${VIEWS[k][0]}</span><span class="c">${k==='overview'?sources().length:k==='vaults'?vaults().length:S.jobs.filter(j=>j.snapshots).length}</span></button>`).join('');
 app.innerHTML=`<div class="root"><aside>
  <div style="height:60px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line)"><span style="width:24px;height:24px;border:1px solid var(--line);border-radius:7px;background:var(--sf);display:grid;place-items:center">${I('archive',13)}</span><span style="font-weight:600;font-size:14px;letter-spacing:-.01em">Hytte</span><span class="m" style="font-size:11px;color:var(--fa);margin-left:auto">${esc(S.version)}</span></div>
  <div style="padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)">
   <div style="display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:6px" title="${tn.ok?'Tailnet':'tailscale svarer ikke i denne containeren'}"><span class="dot" style="background:${tn.ok?'var(--ok)':'var(--fa)'}"></span><span class="m" style="font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(suffix||'tailscale mangler')}</span><span style="margin-left:auto;color:var(--fa)">${I('chevrons-up-down',12)}</span></div>
   <label style="display:flex;align-items:center;gap:8px;padding:0 9px;height:31px;border:1px solid var(--line);border-radius:6px;color:var(--fa)">${I('search',13)}<input id="q" value="${esc(search)}" placeholder="Søk noder, jobber, filer" onkeydown="if(event.key==='Enter')doSearch(this.value)" style="border:0;outline:0;background:transparent;font-size:12.5px;min-width:0;flex:1;color:var(--t)"><span class="m" style="flex:none;font-size:10.5px;padding:1px 5px;border:1px solid var(--ctl);border-radius:4px">⌘K</span></label>
  </div>
  <nav style="padding:12px 8px;display:flex;flex-direction:column;gap:1px">${nav}</nav>
  <div class="lbl" style="padding:14px 18px 8px">KOORDINERING</div>
  <div class="kv" style="padding:0 18px"><span>Leder</span><span>${esc(S.self.name)}</span><span>Term</span><span>1</span><span>Kvorum</span><span style="color:var(--ok)">${vaults().length}/${vaults().length}</span><span>Heartbeat</span><span>lokal</span></div>
  <div style="margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font:400 11px var(--mono);color:var(--fa)">${I('shield-check',13)}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">${tn.ok?'WireGuard · tailscale '+esc(tn.version):'SSH · uten tailscale'}</span><button class="bi" style="margin-left:auto;width:24px;height:24px;border:0" title="Innstillinger" onclick="openSettings()">${I('settings',13)}</button></div>
 </aside><main style="min-width:0;display:flex;flex-direction:column">
  <header class="top"><span class="m" style="font-size:12px;color:var(--fa)">${esc(crumb)}</span><span style="color:var(--ctl)">/</span><span style="font-size:13.5px;font-weight:500">${VIEWS[view][0]}</span>
   <div style="margin-left:auto;display:flex;gap:8px"><button class="b2" onclick="openVault()">${I('plus',13)}Nytt backupsted</button><button class="b1" onclick="runAll()" ${S.jobs.length?'':'disabled'}>${I('play',13)}Kjør alle</button></div></header>
  <div class="content">${view==='overview'?overview():view==='vaults'?vaultsView():filesView()}</div></main></div>`;
 if(view==='vaults')drawLog()}
function doSearch(v){search=v.trim();const s=search.toLowerCase();if(!s)return;const n=S.nodes.find(x=>x.name.toLowerCase().includes(s));const j=S.jobs.find(x=>x.id.includes(s)||x.path.toLowerCase().includes(s));
 if(j&&(!n||j.id.includes(s))){X.job=j.id;X.snap=null;X.path=[];go('files')}else if(n){selNode=n.name;go('overview')}else toast('Ingen treff')}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#q')&&$('#q').focus()}if(e.key==='Escape')closeOv()});

// ── Oversikt ──
function overview(){
 const src=sources(),onl=src.filter(n=>n.online).length,jobs=S.jobs,orig=jobs.reduce((a,j)=>a+(j.orig||0),0),stored=S.store.bytes,saved=orig?Math.max(0,1-stored/orig):0;
 const nx=jobs.filter(j=>j.nextRun).sort((a,b)=>a.nextRun-b.nextRun)[0];
 const k=(l,v,s,c)=>`<div class="kpi"><span class="k">${l}</span><span class="v" style="color:${c||'var(--t)'}">${v}</span><span class="s">${s}</span></div>`;
 const kp=k('Noder online',`${onl}/${src.length}`,`${new Set(jobs.map(j=>j.node)).size} med jobber`)+k('Beskyttet data',fB(orig),`${jobs.filter(j=>j.orig!=null).length} jobber`)+k('Lagret etter zstd',fB(stored),`${S.store.blocks} blokker · dedup`)
  +k('Spart plass',orig?Math.round(saved*100)+'%':'—',orig?fB(Math.max(0,orig-stored))+' spart':'ingen data ennå',orig&&saved>0?'var(--ok)':'')+k('Neste kjøring',nx?nextL(nx.nextRun):'—',nx?esc(nx.id):'ingen planlagt');
 const hasJobs=new Set(jobs.map(j=>j.node)),groups={};for(const n of src){const g=(n.loc||(hasJobs.has(n.name)?'Kilder':'Tailnet')).toUpperCase();(groups[g]=groups[g]||[]).push(n)}
 const order=Object.keys(groups).sort((a,b)=>(a==='TAILNET')-(b==='TAILNET')||a.localeCompare(b));
 const sel=selNode&&(S.nodes.find(n=>n.name===selNode)||(selNode===S.self.name?S.self:null));
 const related=sel&&sel.name===S.self.name?hasJobs:new Set();
 const nodeRow=n=>{const active=sel&&sel.name===n.name,rel=related.has(n.name),pg=n.ping&&n.ping.ms!=null?n.ping.ms+' ms':n.online?'—':'offline',derp=/DERP/.test(n.ping?.tunnel||n.tunnel||'');
  const lit=hasJobs.has(n.name)&&n.online&&(!sel||active||rel),lc=!n.online?'#DCDCE0':lit?(derp?'var(--warn)':'var(--ok)'):'#DCDCE0',ls=!n.online||(derp&&lit)?'dashed':'solid';
  return`<button onclick="selNode='${jq(n.name)}';render()" style="position:relative;display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:8px;cursor:pointer;text-align:left;border:1px solid ${active?'var(--ok)':rel?'var(--okl)':'var(--line)'};background:${active?'rgba(47,158,107,.07)':'var(--sf)'};width:100%">

  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px"><label class="fld"><span class="lbl">LOKASJON</span><input class="inp" id="nl" value="${esc(n.loc||'')}" placeholder="f.eks. Hjemme"></label><label class="fld"><span class="lbl">SSH-BRUKER</span><input class="inp" id="nu" value="${esc(n.user||'root')}"></label><label class="fld"><span class="lbl">PORT</span><input class="inp" id="np" value="${esc(n.port||22)}"></label></div>
  <div id="nt" class="m" style="font-size:11.5px;color:var(--mu)"></div>`,
  `${isNew?'':`<button class="b2" onclick="testNode('${jq(name)}')">${I('plug',13)}Test SSH</button>`}<button class="b2" style="margin-left:auto" onclick="closeNode()">Avbryt</button><button class="b1" onclick="saveNode(${isNew?'null':`'${jq(name)}'`})">Lagre</button>`,520)}
function closeNode(){if(backToJob){backToJob=false;drawJob()}else closeOv()}
async function saveNode(name){const b={loc:$('#nl').value,user:$('#nu').value,port:$('#np').value};if(!name){name=$('#nn').value.trim();b.host=$('#nh').value.trim();if(!name||!b.host)return toast('Fyll inn navn og adresse')}
 await api('/api/nodes/'+encodeURIComponent(name),{method:'PATCH',body:b});toast('Lagret');await refresh();if(backToJob){backToJob=false;J.node=name;J.path='';jBrowse('/mnt/user')}else closeOv()}
async function testNode(name){await api('/api/nodes/'+encodeURIComponent(name),{method:'PATCH',body:{loc:$('#nl').value,user:$('#nu').value,port:$('#np').value}});$('#nt').textContent='Kobler til…';const r=await api('/api/nodes/'+encodeURIComponent(name)+'/test',{method:'POST'});$('#nt').innerHTML=r.ok?`<span style="color:var(--ok)">✓ ${esc(r.info.join(' · '))}</span>`:`<span style="color:var(--err)">✕ ${esc(r.error)}</span>`}
function openVault(){const cand=S.nodes.filter(n=>n.name!==S.self.name&&!S.jobs.some(j=>j.node===n.name));
 dlg('Nytt backupsted','hard-drive',`<div class="fld"><span class="lbl">ENHETER PÅ TAILNET UTEN HYTTE-ROLLE</span><div style="border:1px solid var(--line);border-radius:8px;overflow:hidden">${cand.length?cand.map(n=>`<div class="row" style="grid-template-columns:20px 1.4fr 1fr 1fr;cursor:default"><span class="dot" style="background:${n.online?'var(--ok)':'var(--fa)'}"></span><span class="m" style="font-size:12.5px">${esc(n.name)}</span><span class="m" style="font-size:12px;color:var(--mu)">${esc(n.ip)}</span><span style="font-size:12px;color:var(--fa)">${esc(n.os||'')}</span></div>`).join(''):'<div style="padding:14px;color:var(--fa);font-size:12px">Ingen ledige enheter.</div>'}</div></div>
  <div style="padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:12px;color:var(--t2);line-height:1.6">Flere backupsteder med leder, kvorum og replikering mellom seg kommer i neste versjon. Da installerer du Hytte på enheten og velger den her.</div>`,
  `<button class="b2" style="margin-left:auto" onclick="closeOv()">Lukk</button><button class="b1" disabled>Legg til og synk</button>`)}
function openSettings(){const s=S.settings,T=[['emailSummary','Morgenoppsummering','Varsel kl. 07:00 med status for siste døgn'],['notifyOnFail','Varsle ved feil','Varsel med en gang en jobb feiler'],['verifyAfterRun','Verifiser etter kjøring','Sammenlign sjekksummer på et utvalg filer'],['autoPrune','Automatisk opprydding','Slett snapshots eldre enn grensen og frigjør blokker']];
 dlg('Innstillinger','settings',`<div class="fld"><span class="lbl">SSH-NØKKEL</span><span style="font-size:12px;color:var(--mu);line-height:1.6">Legg denne inn på hver node du vil ta backup av. Unraid: Users → root → SSH authorized keys. Linux: ~/.ssh/authorized_keys.</span><div class="m" style="padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:11px;word-break:break-all;color:var(--t2)">${esc(S.pubkey||'Lages…')}</div><div><button class="b2" onclick="navigator.clipboard.writeText(S.pubkey).then(()=>toast('Kopiert'))">${I('copy',13)}Kopier</button></div></div>
  <div class="fld"><span class="lbl">VARSLER</span>${T.map(([k,l,d])=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--row)"><span style="font-size:12.5px">${l}<br><span style="font-size:11.5px;color:var(--fa)">${d}</span></span><button class="tg ${s[k]?'on':''}" onclick="flip('${k}')"><span></span></button></div>`).join('')}
   <label style="display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mu);padding-top:6px">Send varsler via Unraid på<select class="inp" style="width:auto" onchange="api('/api/settings',{body:{notifyNode:this.value}}).then(refresh)"><option value="">ingen</option>${S.nodes.filter(n=>n.name!==S.self.name).map(n=>`<option ${s.notifyNode===n.name?'selected':''}>${esc(n.name)}</option>`).join('')}</select></label></div>
  <div class="fld"><span class="lbl">PASSORD</span><div style="display:flex;gap:6px"><input class="inp" type="password" id="np2" placeholder="Nytt passord"><button class="b2" style="height:32px" onclick="api('/api/password',{body:{password:$('#np2').value}}).then(()=>toast('Byttet')).catch(e=>toast(e.message))">Bytt</button></div></div>`,
  `<button class="b2" onclick="api('/api/logout').then(()=>{closeOv();showLogin(false)})">${I('log-out',13)}Logg ut</button><button class="b2" onclick="api('/api/prune',{method:'POST'}).then(()=>toast('Opprydding kjørt'))">${I('trash-2',13)}Rydd nå</button><button class="b1" style="margin-left:auto" onclick="closeOv()">Ferdig</button>`,560)}
async function flip(k){S.settings[k]=!S.settings[k];await api('/api/settings',{body:{[k]:S.settings[k]}});openSettings()}
boot();
</script>
</body>
</html>
